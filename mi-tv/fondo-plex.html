<!doctype html>
<!-- Fondo del top shelf para Plex (continue_watching_static). Render: mi-tv/fondo-youtube.sh plex.
     plex-logo.svg es el logo de Plex (Wikimedia Commons, "Plex logo 2022 full-color-on-black.svg"); el resto es diseño propio. -->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#141414}
svg{position:absolute;inset:0}
.logo{position:absolute;left:50%;top:500px;width:760px;transform:translate(-50%,-50%);filter:drop-shadow(0 18px 40px rgba(0,0,0,.55))}
</style></head><body>
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="c" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#121212"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c33b"/><stop offset="1" stop-color="#d98a06"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8740a"/><stop offset="1" stop-color="#7a4a05"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#c)"/>
  <!-- chevrones, el motivo de la x de Plex, entrando por los bordes -->
  <path d="M-80 640 L120 640 L330 950 L120 1260 L-80 1260 L130 950Z" fill="url(#g)"/>
  <path d="M-140 700 L-40 700 L170 1010 L-40 1320 L-140 1320 L70 1010Z" fill="url(#g2)" opacity=".85"/>

  <path d="M1560 760 L1610 760 L1700 890 L1610 1020 L1560 1020 L1650 890Z" fill="#f2b62a" opacity=".55"/>
  <!-- arriba a la izquierda nada: ahí van el reloj y la fecha -->
  <path d="M1040 -40 L1090 -40 L1180 95 L1090 230 L1040 230 L1130 95Z" fill="#e5a00d" opacity=".3"/>
  <!-- líneas finas -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round" opacity=".35" stroke="#e5a00d">
    <path d="M380 1080 L620 720 L860 1080"/>
    <path d="M1300 0 L1420 180 L1300 360"/>
    <path d="M40 560 L160 380"/>

</svg>
<img class="logo" src="plex-logo.svg">
<script>if (location.hash === "#sinlogo") document.querySelector(".logo").style.display = "none";</script>
</body></html>
