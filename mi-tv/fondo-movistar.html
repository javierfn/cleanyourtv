<!doctype html>
<!-- Fondos del top shelf para Movistar Plus+. Con logo (shelf_movistar, sin sugerencias) y sin logo
     (shelf_movistar_fondo, detrás de la fila). Render: mi-tv/fondo-youtube.sh movistar [sinlogo].
     Logo: movistar-logo.svg (Wikimedia Commons, "Movistar Plus+ 2022 logo.svg"), en blanco. Resto, diseño propio. -->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#07080c}
svg{position:absolute;inset:0}
.logo{position:absolute;left:50%;top:500px;height:250px;transform:translate(-50%,-50%);filter:brightness(0) invert(1) drop-shadow(0 18px 40px rgba(0,0,0,.5))}
</style></head><body>
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="c" cx="50%" cy="46%" r="65%">
      <stop offset="0" stop-color="#15171f"/><stop offset="1" stop-color="#06070a"/>
    </radialGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a9ff"/><stop offset=".55" stop-color="#3b6cff"/><stop offset="1" stop-color="#8a3dff"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3dff"/><stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#c)"/>
  <!-- luz difusa en las esquinas -->
  <ellipse cx="1720" cy="120" rx="420" ry="260" fill="#2a5cff" opacity=".35" filter="url(#soft)"/>
  <ellipse cx="160" cy="1000" rx="460" ry="240" fill="#00a9ff" opacity=".28" filter="url(#soft)"/>
  <ellipse cx="1500" cy="1040" rx="380" ry="200" fill="#a23dff" opacity=".25" filter="url(#soft)"/>
  <!-- cintas onduladas, como el trazo de la M -->
  <g fill="none" stroke-linecap="round">
    <path d="M-80 900 C 220 700, 420 1060, 720 900 S 1180 700, 1460 880 S 1840 1020, 2000 860" stroke="url(#w1)" stroke-width="46" opacity=".9"/>
    <path d="M-80 900 C 220 700, 420 1060, 720 900 S 1180 700, 1460 880 S 1840 1020, 2000 860" stroke="url(#w1)" stroke-width="46" opacity=".6" filter="url(#glow)"/>
    <path d="M-80 980 C 260 820, 460 1120, 780 980 S 1240 820, 1520 960 S 1880 1080, 2000 960" stroke="url(#w2)" stroke-width="14" opacity=".75"/>
    <path d="M1180 -60 C 1340 120, 1460 -40, 1600 110 S 1840 260, 2000 120" stroke="url(#w1)" stroke-width="30" opacity=".75"/>
    <path d="M1240 -20 C 1400 170, 1520 10, 1660 160 S 1880 300, 2000 190" stroke="url(#w2)" stroke-width="8" opacity=".6"/>
  </g>
</svg>
<img class="logo" src="movistar-logo.svg">
<script>if (location.hash === "#sinlogo") document.querySelector(".logo").style.display = "none";</script>
</body></html>
