<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:640px;height:360px;overflow:hidden;background:transparent}

.t{display:flex;flex-direction:column;line-height:1}
.tv{font-size:150px;font-weight:800;letter-spacing:-6px}
.live{margin-top:10px;font-size:38px;font-weight:700;letter-spacing:6px;display:flex;align-items:center;gap:12px;color:#e8ecf5}
.dot{width:22px;height:22px;border-radius:50%;background:#4da3ff;box-shadow:0 0 18px #4da3ff}
</style></head><body><div class="b">
<span class="a">&#xF8FF;</span>
<div class="t"><div class="tv">tv</div><div class="live"><span class="dot"></span>HDMI 1</div></div>
